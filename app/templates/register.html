{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-head">
    <p class="eyebrow">Start free</p>
    <h1>Create your workspace</h1>
    <p class="page-subtitle">One account, one private workspace. Your data stays yours.</p>
</div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form class="form-stack" action="/register" method="post">
    <div class="field"><label for="register-name">Your name</label><input id="register-name" name="name" placeholder="e.g. Alex Carter" required autofocus></div>
    <div class="field"><label for="register-email">Email</label><input id="register-email" type="email" name="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="register-password">Password</label><input id="register-password" type="password" name="password" minlength="8" placeholder="At least 8 characters" required></div>
    <button type="submit">Create account <span aria-hidden="true">→</span></button>
</form>
<p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
{% endblock %}
